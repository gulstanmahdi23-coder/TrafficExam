<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەی تیوری نووسینگەی مێرگەسۆر</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/1.png.jpg">
</head>
<body>
    <!-- بەشی داواکردنی پاسوورد -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-content">
            <!-- زیادکردنی لۆگۆکان لەناو سندوقەکەدا -->
            <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 15px;">
                <img src="images/1.png.jpg" alt="لۆگۆ ١" style="width: 70px; height: 70px; object-fit: contain;">
                <img src="images/2.png.jpg" alt="لۆگۆ ٢" style="width: 70px; height: 70px; object-fit: contain;">
            </div>

            <h3>نووسینگەی شۆفیری مێرگەسۆر</h3>
            <p>تکایە پاسووردی نووسینگە بنووسە</p>
            <input type="password" id="modalPasswordInput" placeholder="پاسوورد بنووسە...">
            <button id="modalSubmitBtn">چوونە ژوورەوە</button>
        </div>
    </div>

    <div class="main-container">
        <!-- بەشی یەکەم: ناونووسین -->
        <div id="name-section" class="card">
            <h1>تاقیکردنەوەی تیوری نووسینگەی مێرگەسۆر</h1>
            <h2>تکایە ناوی سیانی خۆت بنووسە</h2>
            <input type="text" id="driver-name" placeholder="ناوی سیانی..." spellcheck="false">
            <button onclick="startQuiz()">دەستپێکردن</button>
        </div>

        <!-- بەشی دووەم: هەڵبژاردنی گرووپ -->
        <div id="group-select-section" class="card hidden">
            <h2>گرووپی پرسیارەکان هەڵبژێرە</h2>
            <button onclick="selectGroup('A')">گرووپی A</button>
            <button onclick="selectGroup('B')">گرووپی B</button>
            <button onclick="selectGroup('C')">گرووپی C</button>
            <button onclick="selectGroup('D')">گرووپی D</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
