<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەی تیوری نووسینگەی مێرگەسۆر</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/1.png.jpg">
</head>
<body>
    <!-- بەشی داواکردنی پاسوورد -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-box">
            <h3>تاقیکردنەوەی تیوری نووسینگەی مێرگەسۆر</h3>
            <p>تکایە پاسووردی نووسینگە بنووسە</p>
            <input type="password" id="modalPasswordInput" placeholder="پاسوورد بنووسە...">
            <button id="modalSubmitBtn">چوونە ژوورەوە</button>
        </div>
    </div>

    <div class="main-container">
        <!-- شاشەی یەکەم: ناوی سیانی، لۆگۆکان و هەڵبژاردنی گرووپ پێکەوە لە ناو کارتی سەرەکیدا -->
        <div id="name-section" class="card">
            <!-- لۆگۆکان بە مەودایەکی گونجاو (ڕاستکراوەتەوە بۆ مۆبایل) -->
            <div class="logo-container">
                <img src="images/1.png.jpg" alt="لۆگۆ ١" class="logo-img">
                <img src="images/2.png.jpg" alt="لۆگۆ ٢" class="logo-img">
            </div>    
            <h1>تاقیکردنەوەی تیوری نووسینگەی مێرگەسۆر</h1>
            <h2>تکایە ناوی سیانی خۆت بنووسە</h2>
            <input type="text" id="driver-name" placeholder="ناوی سیانی..." spellcheck="false">
            
            <!-- هەڵبژاردنی گرووپی پرسیارەکان لە ناو سندوقەکەدا -->
            <div style="margin: 15px 0; width: 100%;">
                <h3 style="font-size: 16px; margin-bottom: 10px;">گرووپی پرسیارەکان هەڵبژێرە:</h3>
                <div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;">
                    <button onclick="selectGroup('A')" style="padding: 6px 12px; cursor: pointer;">گرووپی A</button>
                    <button onclick="selectGroup('B')" style="padding: 6px 12px; cursor: pointer;">گرووپی B</button>
                    <button onclick="selectGroup('C')" style="padding: 6px 12px; cursor: pointer;">گرووپی C</button>
                    <button onclick="selectGroup('D')" style="padding: 6px 12px; cursor: pointer;">گرووپی D</button>
                </div>
            </div>
            
            <button onclick="startQuiz()">دەستپێکردن</button>
        </div>

        <!-- بەشی پرسیارەکان -->
        <div id="quiz-section" class="card hidden">
            <!-- کاتژمێرەکە لێرە زیادکرا -->
            <div id="timer" style="font-size: 22px; font-weight: bold; color: #d9534f; margin-bottom: 15px; text-align: center;">⏱️ کاتی ماوە: 60 چرکە</div>
            
            <h3 id="question-text" style="margin-bottom: 20px; font-size: 18px;"></h3>
            <img id="question-image" src="" alt="وێنەی پرسیار" style="display:none; max-width:100%; height:auto; margin-bottom:15px; border-radius:8px;" />
            
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button id="choice1-btn" onclick="checkAnswer(1)" style="padding: 10px; cursor: pointer; text-align: right;"></button>
                <button id="choice2-btn" onclick="checkAnswer(2)" style="padding: 10px; cursor: pointer; text-align: right;"></button>
                <button id="choice3-btn" onclick="checkAnswer(3)" style="padding: 10px; cursor: pointer; text-align: right;"></button>
            </div>
        </div>

        <!-- بەشی ئەنجامی کۆتایی تاقیکردنەوەکە -->
        <div id="result-section" class="card hidden">
            <h2>ئەنجامی تاقیکردنەوە</h2>
            <p id="final-score-text" style="font-size: 18px; margin-top: 15px;"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
